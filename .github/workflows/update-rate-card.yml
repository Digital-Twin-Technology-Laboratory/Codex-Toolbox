name: Update Codex rate card

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-codex-rate-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test strict parser
        run: python -m unittest discover -s Tests/RateCardScriptTests -v

      - name: Fetch and validate official rates
        run: python scripts/update_rate_card.py --write

      - name: Commit changed manifest only
        shell: bash
        run: |
          if git diff --quiet -- Sources/CodexToolbox/Resources/codex-rate-card-v1.json; then
            echo "Official rates are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/CodexToolbox/Resources/codex-rate-card-v1.json
          git commit -m "chore: update Codex rate card"
          git push origin HEAD:main
