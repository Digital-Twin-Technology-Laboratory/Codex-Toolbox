name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Match the Build 65 release compiler. Swift 6.3.3 can abort on cross-module
    # async default closures in debug tests (swiftlang/swift#92017).
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify native analytics bridge
        run: bash scripts/build_native_analytics.sh --test

      - name: Generate project
        run: xcodegen generate

      - name: Verify core
        run: |
          python3 -m unittest discover -s Tests/RateCardScriptTests -v
          python3 -m unittest discover -s Tests/APIPriceScriptTests -v
          swift test
          swift run CoreVerification

      - name: Run Xcode tests
        run: |
          xcodebuild \
            -project CodexToolbox.xcodeproj \
            -scheme CodexToolbox \
            -destination 'platform=macOS' \
            ARCHS="$(uname -m)" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            test
